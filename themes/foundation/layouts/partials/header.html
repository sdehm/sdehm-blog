<header class="site-header">
  <div class="container container--wide site-header__inner">
    <a class="site-brand" href="{{ .Site.Home.Permalink }}" aria-label="{{ .Site.Title }} — home">
      <svg class="site-brand__mark" viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2C10.2 5.1 5.4 11.2 5.4 15c0 3.5 3.8 8.5 6.6 11 2.8-2.5 6.6-7.5 6.6-11C18.6 11.2 13.8 5.1 12 2Z" />
        <circle cx="12" cy="16.4" r="1.1" />
        <path d="M12 17.5V26" />
      </svg>
      <span class="site-brand__name">{{ .Site.Title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <ul class="site-nav__list">
        {{ range .Site.Menus.main }}
          <li>
            <a
              class="site-nav__link"
              href="{{ .URL }}"
              {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}
              >{{ .Name }}</a
            >
          </li>
        {{ end }}
      </ul>
      <button
        type="button"
        class="icon-button theme-toggle"
        data-theme-toggle
        aria-label="Toggle color theme"
        title="Toggle color theme"
      >
        <svg data-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg data-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden>
          <path d="M20 14.5a8.5 8.5 0 1 1-9.5-9.4 7 7 0 0 0 9.5 9.4Z" />
        </svg>
      </button>
    </nav>
  </div>
</header>

# -- Theme Options --
# Parameters consumed by the "foundation" theme (themes/foundation).
description = "Exploring AI, traditional ML, and the craft of building useful software."
dateFormat = "2 January 2006"

# Show a collapsible table of contents on article pages.
showTableOfContents = true

[author]
  name = "Shaffer Dehmlow"
  github = "https://github.com/sdehm"
  linkedin = "https://linkedin.com/in/shaffer-dehmlow"

[article]
  # Renders a views_<path> mount point in the article meta row for the
  # site's custom WebSocket backend (see assets/js/custom.js) to populate.
  showViews = true

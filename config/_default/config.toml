# -- Site Configuration --
# Theme options live in params.toml; design tokens are in themes/foundation/assets/css/tokens.css.

baseURL = "https://sdehm.dev/"
defaultContentLanguage = "en"
theme = "foundation"

enableRobotsTXT = true
summaryLength = 30

buildDrafts = false
buildFuture = false

# googleAnalytics = "G-XXXXXXXXX"

[pagination]
  pagerSize = 20

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS"]
